# Tras cada push a main: incrementa versión (patch o minor) y hace commit.
# - Patch (1.3.0 → 1.3.1): correcciones por defecto.
# - Minor (1.3.x → 1.4.0): mensaje de commit con feat: o [minor] o [feat]
# Los commits generados con chore(release): no vuelven a bump (evita bucle).

name: Versionado automático

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'chore(release):') && !contains(github.event.head_commit.message, '[skip version]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determinar tipo de bump
        id: kind
        run: |
          MSG=$(printf '%s' "${{ github.event.head_commit.message }}")
          if echo "$MSG" | grep -qiE '(^|\n|\r)(feat(\(|:)|\[minor\]|\[feat\])'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
            echo "Bump: minor"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
            echo "Bump: patch"
          fi

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ejecutar bump
        id: ver
        run: |
          node scripts/bump-version.mjs "${{ steps.kind.outputs.type }}"
          V=$(node -p "JSON.parse(require('fs').readFileSync('version.json','utf8')).version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Nueva versión: $V"

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json package.json app.js index.html
          if git diff --staged --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "chore(release): v${{ steps.ver.outputs.version }} [skip version]"
          git push
